  <!-- Institutional Fonts: IBM Plex Mono (Tabular Data) & Space Grotesk (Titles) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Citadel 360 Institutional Design System (Or Ambre & Carbone Mineral) -->

      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            citadel: {
              bg: '#090D14',
              surface: '#111726',
              card: '#0F172A',
              border: '#1E293B',
              gold: '#D99B43',
              'gold-light': '#F3BA63',
              'gold-dark': '#8C6239',
              muted: '#64748B',
              steel: '#4A6FA5',
              sauge: '#10B981',
              vermillon: '#E11D48',
            }
          },
          fontFamily: {
            sans: ['Space Grotesk', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
            display: ['Space Grotesk', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS & JS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
