{% raw %}
<!-- MODALE INSTITUTIONNELLE D'INFORMATION ET DE QUOTA SANDBOX -->
<div v-if="showErrorModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-white backdrop-blur-md">
  <div class="bg-white rounded-xl border border-slate-200 rounded-2xl max-w-lg w-full p-6 border border-amber-500/40  space-y-5 transform animate-in fade-in zoom-in duration-200">
    <div class="flex justify-between items-start pb-3 border-b border-slate-200">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-lg">
          🛡️
        </div>
        <div>
          <h3 class="text-base font-black text-slate-900 font-sans">Information Environnement Sandbox</h3>
          <p class="text-xs text-slate-500 font-sans">Plateforme CITADEL 360°</p>
        </div>
      </div>
      <button @click="showErrorModal = false" class="text-slate-500 hover:text-slate-900 font-sans text-sm">✕</button>
    </div>

    <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3 font-sans text-xs text-slate-700 leading-relaxed">
      <p>{{ errorMessage }}</p>
    </div>

    <div class="flex flex-col sm:flex-row items-center justify-end gap-3 pt-2">
      <button 
        @click="showErrorModal = false"
        class="w-full sm:w-auto px-5 py-2.5 rounded-xl font-bold font-sans text-xs bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-black   border border-amber-400/30 transition"
      >
        Compris
      </button>
    </div>
  </div>
</div>
{% endraw %}
