{% raw %}
<!-- MODALE INSTITUTIONNELLE D'INFORMATION ET DE QUOTA SANDBOX -->
<div v-if="showErrorModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
  <div class="bg-white rounded-xl border border-slate-200 max-w-lg w-full p-6 space-y-5 transform animate-in fade-in zoom-in duration-200">
    <div class="flex justify-between items-start pb-3 border-b border-slate-200">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-teal-50 border border-teal-200 flex items-center justify-center text-teal-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div>
          <h3 class="text-base font-bold text-slate-900 font-sans">Information Système</h3>
          <p class="text-xs text-slate-500 font-sans">Consultation d'entreprises</p>
        </div>
      </div>
      <button @click="showErrorModal = false" class="text-slate-400 hover:text-slate-700 font-sans text-sm">✕</button>
    </div>

    <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3 font-sans text-xs text-slate-700 leading-relaxed">
      <p>{{ errorMessage }}</p>
    </div>

    <div class="flex flex-col sm:flex-row items-center justify-end gap-3 pt-2">
      <button 
        @click="showErrorModal = false"
        class="w-full sm:w-auto px-5 py-2 rounded-lg font-medium font-sans text-xs bg-teal-700 hover:bg-teal-800 text-white transition"
      >
        Compris
      </button>
    </div>
  </div>
</div>
{% endraw %}
