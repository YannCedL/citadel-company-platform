{% raw %}
<!-- STATE 2: LOADING STATE -->
      <main v-else-if="isLoading" class="flex-1 flex flex-col items-center justify-center max-w-7xl w-full mx-auto px-4 py-24 space-y-6 relative z-10">
        <div class="w-16 h-16 rounded-2xl bg-teal-50 border border-teal-200 flex items-center justify-center relative p-2.5">
          <img src="/static/img/citadel_logo.svg" alt="Citadel 360°" class="w-8 h-8 object-contain animate-pulse" />
          <div class="absolute inset-0 rounded-2xl border-2 border-teal-600 border-t-transparent animate-spin"></div>
        </div>
        <div class="text-center space-y-1 font-sans">
          <h3 class="text-base font-bold text-slate-900">Chargement du dossier d'entreprise...</h3>
          <p class="text-xs text-slate-500">Collecte et consolidation des données officielles pour le SIREN {{ activeSiren }}</p>
        </div>
      </main>
{% endraw %}
