[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citadel-company-platform"
version = "1.0.0"
description = "Company Intelligence Platform aggregating all company engines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Genesis OSINT Team" }]
dependencies = [
    "genesis-core @ git+https://github.com/YannCedL/genesis-core.git",
    "argus-company-research @ git+https://github.com/YannCedL/argus-company-research.git",
    "ariadne-corporate-graph @ git+https://github.com/YannCedL/ariadne-corporate-graph.git",
    "mercury-financial-intel @ git+https://github.com/YannCedL/mercury-financial-intel.git",
    "chamber-executive-network @ git+https://github.com/YannCedL/chamber-executive-network.git",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]